[workspace]
members  = ["crates/*", "tools/xtask", "examples/p3-smoke"]
default-members = ["crates/scu", "crates/scu-cli", "crates/scu-wasi-host", "tools/xtask"]
resolver = "3"

[workspace.dependencies]
scu = { path = "crates/scu", version = "0.0.0" }
cargo_metadata = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
toml_edit = "0.25.17"
tokio = { version = "1.53.2", features = ["macros", "rt", "time"] }
wasmtime = { version = "=49.0.2", default-features = false, features = ["std", "runtime", "cranelift", "component-model-async"] }
wasmtime-wasi = { version = "=49.0.2", default-features = false, features = ["p3"] }
wit-bindgen = "=0.62.0"
wat = "=1.258.3"
scu-wasi-host = { path = "crates/scu-wasi-host" }

[workspace.package]
version      = "0.0.0"
edition      = "2024"
rust-version = "1.99.0"
authors      = ["Carlos Eduardo Ferreyra <eduferreyraok@gmail.com>"]
license      = "MIT"
repository   = "https://github.com/carlosferreyra/scu"
homepage     = "https://github.com/carlosferreyra/scu"
description  = "System Composition Utility (SCU): provider-agnostic infrastructure composition."
readme       = "README.md"
keywords     = []
categories   = []

[workspace.metadata.xtask]
crate-prefix  = "scu"
primary-crate = "scu"

[workspace.lints.rust]
unsafe_code     = "warn"
unreachable_pub = "warn"
missing_docs    = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -2 }
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
module_name_repetitions = "allow"
must_use_candidate      = "allow"
too_many_lines          = "allow"
